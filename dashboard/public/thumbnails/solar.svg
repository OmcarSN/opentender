<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1c08"/>
      <stop offset="40%" stop-color="#4d2f0d"/>
      <stop offset="80%" stop-color="#142820"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </linearGradient>
    <linearGradient id="hill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b3829"/>
      <stop offset="100%" stop-color="#11241a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sunset)"/>
  <!-- Warm glow sun on horizon -->
  <circle cx="200" cy="115" r="45" fill="url(#sun)"/>
  <circle cx="200" cy="115" r="22" fill="#fde68a" opacity="0.6"/>
  <!-- Rolling cypress hills -->
  <path d="M0,150 Q100,120 200,145 T400,135 L400,250 L0,250 Z" fill="#132c22"/>
  <path d="M0,175 Q120,150 250,180 T400,165 L400,250 L0,250 Z" fill="url(#hill)"/>
  <path d="M0,205 Q150,185 280,210 T400,195 L400,250 L0,250 Z" fill="#0d1f17"/>
  <!-- Cypress silhouettes (tall thin trees matching Tuscany postcard) -->
  <polygon points="60,175 63,145 66,175" fill="#09140f"/>
  <polygon points="70,178 72.5,150 75,178" fill="#09140f"/>
  <polygon points="82,180 84.5,152 87,180" fill="#09140f"/>
  <polygon points="120,170 123,138 126,170" fill="#09140f"/>
  <polygon points="135,175 137.5,145 140,175" fill="#09140f"/>
  <polygon points="280,195 283,160 286,195" fill="#09140f"/>
  <polygon points="295,200 297.5,165 300,200" fill="#09140f"/>
  <!-- Solar panel rows on front hill -->
  <line x1="160" y1="215" x2="240" y2="215" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <line x1="150" y1="225" x2="250" y2="225" stroke="#38bdf8" stroke-width="1.8" opacity="0.8"/>
  <line x1="140" y1="235" x2="260" y2="235" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
</svg>

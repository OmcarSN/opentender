<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1918"/>
      <stop offset="50%" stop-color="#102a27"/>
      <stop offset="100%" stop-color="#071413"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Star dots -->
  <circle cx="50" cy="30" r="1" fill="#99f6e4" opacity="0.6"/>
  <circle cx="120" cy="45" r="1.5" fill="#99f6e4" opacity="0.8"/>
  <circle cx="280" cy="25" r="1.2" fill="#99f6e4" opacity="0.7"/>
  <circle cx="340" cy="60" r="1" fill="#99f6e4" opacity="0.5"/>
  <!-- Distant mountain peaks -->
  <polygon points="40,160 140,80 230,170" fill="#0e3431" opacity="0.7"/>
  <polygon points="170,170 260,65 370,180" fill="#134440" opacity="0.9"/>
  <polygon points="20,180 110,110 200,190" fill="#164e4a"/>
  <polygon points="240,185 320,100 400,190" fill="#115e59"/>
  <!-- Aurora Borealis sweep -->
  <path d="M0,100 Q100,50 200,90 T400,60 L400,140 Q300,160 200,120 T0,140 Z" fill="url(#glow)"/>
  <!-- Grid wireframe ground -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#14b8a6" stroke-width="0.7" opacity="0.4"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#14b8a6" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#14b8a6" stroke-width="1.5" opacity="0.8"/>
  <!-- Perspective lines -->
  <line x1="60" y1="190" x2="0" y2="250" stroke="#14b8a6" stroke-width="0.8" opacity="0.5"/>
  <line x1="140" y1="190" x2="100" y2="250" stroke="#14b8a6" stroke-width="0.8" opacity="0.5"/>
  <line x1="200" y1="190" x2="200" y2="250" stroke="#14b8a6" stroke-width="1" opacity="0.6"/>
  <line x1="260" y1="190" x2="300" y2="250" stroke="#14b8a6" stroke-width="0.8" opacity="0.5"/>
  <line x1="340" y1="190" x2="400" y2="250" stroke="#14b8a6" stroke-width="0.8" opacity="0.5"/>
  <!-- Light node -->
  <circle cx="260" cy="65" r="3" fill="#5eead4"/>
  <circle cx="260" cy="65" r="8" fill="#5eead4" opacity="0.3"/>
</svg>
